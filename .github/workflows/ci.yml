name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Scan tracked files for private data
        shell: pwsh
        run: ./scripts/Scan-PublicSafety.ps1
      - run: npm audit --omit=dev
